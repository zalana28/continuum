[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continuum"
version = "0.1.0"
description = "Continuum — SOC triage agent with institutional memory (Sibyl Labs Hackathon)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "sibyl-memory-client>=0.6.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
continuum = "continuum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
